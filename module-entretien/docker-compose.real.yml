services:
  entretien-app:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8004 --no-reload"
    environment:
      VEHICULE_SERVICE_URL: "http://host.docker.internal:8090"
      VEHICULE_API_PREFIX: ""
      VEHICULE_CHECK: "true"