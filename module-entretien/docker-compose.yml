services:
  entretien-app:
    build: .
    restart: on-failure
    ports: ["8001:8001"]
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "base64:FWipJPECcyWm1zn77FfVKGRcEjNaqv9A+exl2KyyGik="
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      DB_CONNECTION: mysql
      DB_HOST: entretien-db
      DB_PORT: 3306
      DB_DATABASE: entretien_db
      DB_USERNAME: root
      DB_PASSWORD: secret
      VEHICULE_CHECK: "true"
      VEHICULE_SERVICE_URL: "http://vehicule-mock:8002"
    depends_on:
      entretien-db:
        condition: service_healthy

  entretien-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: entretien_db
    ports: ["3307:3306"]
    volumes: [entretien_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  vehicule-mock:
    image: php:8.4-cli
    command: php -S 0.0.0.0:8002 /mock/index.php
    ports: ["8002:8002"]
    volumes: ["./mock:/mock"]

volumes:
  entretien_data:
