services:
  entretien-app:
    build: .
    restart: on-failure
    ports: ["8004:8004"]
    volumes: [".:/var/www"]
    networks: [default, flotte-net]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment: &env
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "base64:FWipJPECcyWm1zn77FfVKGRcEjNaqv9A+exl2KyyGik="
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      DB_CONNECTION: mysql
      DB_HOST: host.docker.internal
      DB_PORT: "${DB_HOST_PORT:-3306}"
      DB_DATABASE: entretien_db
      DB_USERNAME: root
      DB_PASSWORD: "${DB_ROOT_PASSWORD:-changez_moi}"
      VEHICULE_CHECK: "true"
      VEHICULE_SERVICE_URL: "http://vehicule-mock:8002"
      CHAUFFEUR_SERVICE_URL: "http://chauffeur-mock:8003"
      JWT_SECRET: "${JWT_SECRET:-secret-dev-a-changer}"

  entretien-scheduler:
    build: .
    restart: on-failure
    command: php artisan schedule:work
    volumes: [".:/var/www"]
    networks: [default, flotte-net]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment: *env

  vehicule-mock:
    image: node:20-alpine
    command: node /mock/server.js
    networks: [default]
    ports: ["8002:8002"]
    volumes: ["./docker/mock-vehicule:/mock"]

  chauffeur-mock:
    image: node:20-alpine
    command: node /mock/server.js
    networks: [default]
    ports: ["8003:8003"]
    volumes: ["./docker/mock-chauffeur:/mock"]

networks:
  flotte-net:
    external: true
    name: flotte-net