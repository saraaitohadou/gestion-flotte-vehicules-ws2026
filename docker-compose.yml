x-auth-env: &auth-env
  JWT_SECRET: ${JWT_SECRET}
  SERVICE_API_KEY: ${SERVICE_API_KEY}

services:
  # ==========================================
  # 1. BASE DE DONNÉES COMMUNE (MySQL)
  # ==========================================
  db-commune:
    image: mysql:8.0
    container_name: flotte-db-commune
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-gestion_flotte}
    ports:
      - "${DB_HOST_PORT:-3306}:3306"
    volumes:
      - db_commune_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
      # Schemas versionnes sources par db/init/*.sql (jamais executes deux fois).
      # Hors de /docker-entrypoint-initdb.d (monte en lecture seule) pour eviter
      # une erreur de creation de point de montage.
      - ./db/migrations:/docker-entrypoint-migrations/vehicule:ro
      - ./module-chauffeur/db/migrations:/docker-entrypoint-migrations/chauffeur:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      flotte-network:
        aliases:
          - db

  # ==========================================
  # 2. INTERFACE VISUELLE (phpMyAdmin)
  # ==========================================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: flotte-phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db-commune
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    depends_on:
      db-commune:
        condition: service_healthy
    networks:
      - flotte-network

  # ==========================================
  # 3. MODULE VÉHICULE (Service PHP)
  # ==========================================
  vehicule-service:
    build:
      context: ./module-vehicule
      dockerfile: Dockerfile
    container_name: flotte-vehicule-service
    restart: unless-stopped
    ports:
      - "8001:80"
    environment:
      <<: *auth-env
      DB_HOST: db-commune
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-gestion_flotte}
      DB_USER: ${DB_USER:-root}
      DB_PASS: ${DB_ROOT_PASSWORD}
      CHAUFFEUR_SERVICE_URL: http://chauffeur-service:8000
    depends_on:
      db-commune:
        condition: service_healthy
    networks:
      - flotte-network

  # ==========================================
  # 4. MODULE CHAUFFEUR (Service FastAPI)
  # ==========================================
  chauffeur-service:
    build:
      context: ./module-chauffeur
      dockerfile: Dockerfile
    container_name: flotte-chauffeur-service
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      <<: *auth-env
      DB_HOST: db-commune
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-gestion_flotte}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      VEHICULE_SERVICE_URL: http://vehicule-service
    depends_on:
      db-commune:
        condition: service_healthy
    networks:
      - flotte-network

  # ==========================================
  # 5. MODULE CARBURANT (Service FastAPI)
  # ==========================================
  carburant-service:
    build:
      context: ./module-carburant
      dockerfile: Dockerfile
    container_name: flotte-carburant-service
    restart: unless-stopped
    ports:
      - "${CARBURANT_PORT:-8003}:8000"
    environment:
      <<: *auth-env
      DB_HOST: db-commune
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-gestion_flotte}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      VEHICULE_SERVICE_URL: http://vehicule-service
      CHAUFFEUR_SERVICE_URL: http://chauffeur-service:8000
    depends_on:
      db-commune:
        condition: service_healthy
    networks:
      - flotte-network

  # ==========================================
  # 6. MODULE ENTRETIEN (Laravel)
  # ==========================================
  entretien-app:
    build:
      context: ./module-entretien
    container_name: flotte-entretien-app
    restart: on-failure
    ports:
      - "${ENTRETIEN_PORT:-8004}:8004"

    environment: &entretien-env
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "base64:FWipJPECcyWm1zn77FfVKGRcEjNaqv9A+exl2KyyGik="
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      DB_CONNECTION: mysql
      DB_HOST: db-commune
      DB_PORT: 3306
      DB_DATABASE: ${DB_NAME:-gestion_flotte}
      DB_USERNAME: ${DB_USER:-root}
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_API_KEY: ${SERVICE_API_KEY}
      VEHICULE_CHECK: "true"
      VEHICULE_SERVICE_URL: "http://vehicule-service:80"
      VEHICULE_API_PREFIX: "/api"
      CHAUFFEUR_SERVICE_URL: "http://chauffeur-service:8000"
      CHAUFFEUR_API_PREFIX: "/api"
      SYNCHRONISATION_TENTATIVES_MAX: 3
    depends_on:
      db-commune:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$r = @file_get_contents(\"http://127.0.0.1:8004/api/health\"); exit($$r !== false && strpos($$r, \"entretien\") !== false ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - flotte-network

  entretien-scheduler:
    build:
      context: ./module-entretien
    container_name: flotte-entretien-scheduler
    restart: on-failure
    command: php artisan schedule:work

    environment: *entretien-env
    depends_on:
      db-commune:
        condition: service_healthy
    healthcheck:
      # Le scheduler n'expose pas de port HTTP : on verifie son processus.
      test: ["CMD-SHELL", "php -r 'foreach (glob(\"/proc/[0-9]*/cmdline\") as $$f) { if (strpos((string) @file_get_contents($$f), \"schedule:work\") !== false) exit(0); } exit(1);'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - flotte-network

  # Mock Chauffeur (temporaire, jusqu'a l'integration du vrai service)
  chauffeur-mock:
    image: node:20-alpine
    container_name: flotte-chauffeur-mock
    command: node /mock/server.js
    volumes:
      - ./module-entretien/docker/mock-chauffeur:/mock
    networks:
      - flotte-network

volumes:
  db_commune_data:

networks:
  flotte-network:
    driver: bridge
