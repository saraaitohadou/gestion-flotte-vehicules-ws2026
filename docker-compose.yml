services:
  # ==========================================
  # 1. BASE DE DONNÉES COMMUNE (MySQL)
  # ==========================================
  db-commune:
    image: mysql:8.0
    container_name: flotte-db-commune
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "${DB_HOST_PORT:-3306}:3306"
    volumes:
      - db_commune_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - flotte-network

  # ==========================================
  # 2. INTERFACE VISUELLE (phpMyAdmin)
  # ==========================================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: flotte-phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db-commune
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    depends_on:
      db-commune:
        condition: service_healthy
    networks:
      - flotte-network

  # ==========================================
  # 3. MODULE VÉHICULE (Votre service PHP)
  # ==========================================
  vehicule-service:
    build:
      context: ./module-vehicule
      dockerfile: Dockerfile
    container_name: flotte-vehicule-service
    restart: unless-stopped
    ports:
      - "8001:80"
    environment:
      DB_HOST: db-commune
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_API_KEY: ${SERVICE_API_KEY}
    depends_on:
      db-commune:
        condition: service_healthy
    networks:
      - flotte-network

  # ==========================================
  # 4. MODULE ENTRETIEN (Laravel)
  # ==========================================
  entretien-app:
    build:
      context: ./module-entretien
    container_name: flotte-entretien-app
    restart: on-failure
    ports:
      - "${ENTRETIEN_PORT:-8004}:8004"
    volumes:
      - ./module-entretien:/var/www
    environment: &entretien-env
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "base64:FWipJPECcyWm1zn77FfVKGRcEjNaqv9A+exl2KyyGik="
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      DB_CONNECTION: mysql
      DB_HOST: db-commune
      DB_PORT: 3306
      DB_DATABASE: ${ENTRETIEN_DB_NAME:-entretien_db}
      DB_USERNAME: ${DB_USER:-root}
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_API_KEY: ${SERVICE_API_KEY}
      VEHICULE_CHECK: "true"
      VEHICULE_SERVICE_URL: "http://vehicule-service:80"
      CHAUFFEUR_SERVICE_URL: "http://chauffeur-mock:8003"
    depends_on:
      db-commune:
        condition: service_healthy
    networks:
      - flotte-network

  entretien-scheduler:
    build:
      context: ./module-entretien
    container_name: flotte-entretien-scheduler
    restart: on-failure
    command: php artisan schedule:work
    volumes:
      - ./module-entretien:/var/www
    environment: *entretien-env
    depends_on:
      db-commune:
        condition: service_healthy
    networks:
      - flotte-network

  # Mock Chauffeur (temporaire, jusqu'a l'integration du vrai service)
  chauffeur-mock:
    image: node:20-alpine
    container_name: flotte-chauffeur-mock
    command: node /mock/server.js
    volumes:
      - ./module-entretien/docker/mock-chauffeur:/mock
    networks:
      - flotte-network
volumes:
  db_commune_data:

networks:
  flotte-network:
    driver: bridge