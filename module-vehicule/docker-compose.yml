services:
  vehicule-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - vehicule_db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  vehicule-service:
    build: .
    ports:
      - "8090:80"
    environment:
      DB_HOST: vehicule-db
      DB_PORT: "3306"
      DB_NAME: vehicule_db
      DB_USER: root
      DB_PASS: ${DB_ROOT_PASSWORD}
    depends_on:
      vehicule-db:
        condition: service_healthy

volumes:
  vehicule_db_data: