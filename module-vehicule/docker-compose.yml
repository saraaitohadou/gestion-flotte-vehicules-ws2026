# Compose "module seul" : aucun serveur MySQL n'est demarre ici.
# La base commune du stack racine (flotte-db-commune / gestion_flotte) doit etre active.
# Reseau genere par la stack racine : flotte_flotte-network.
services:
  vehicule-service:
    build: .
    ports:
      - "8001:80"
    environment:
      DB_HOST: db-commune
      DB_PORT: "3306"
      DB_NAME: gestion_flotte
      DB_USER: root
      DB_PASS: ${DB_ROOT_PASSWORD:-rootpassword}
      JWT_SECRET: ${JWT_SECRET:-masterilexcellenceprojetws}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-cle-service-interne-a-changer}
    networks:
      - flotte-network

networks:
  flotte-network:
    external: true
    name: flotte_flotte-network
