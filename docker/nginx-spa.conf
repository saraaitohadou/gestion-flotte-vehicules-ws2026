server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ==========================================
    # 1. BACKEND CHAUFFEUR (FastAPI :8000)
    # ==========================================
    location = /login {
        proxy_pass http://chauffeur-service:8000/api/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ^~ /api/auth {
        proxy_pass http://chauffeur-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ^~ /api/chauffeurs {
        proxy_pass http://chauffeur-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ^~ /espace-chauffeur {
        proxy_pass http://chauffeur-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ^~ /vehicules-disponibles {
        proxy_pass http://chauffeur-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ==========================================
    # 2. BACKEND VÉHICULE (PHP :80 - sans préfixe /api)
    # ==========================================
    location ^~ /api/vehicules {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://vehicule-service:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ^~ /api/affectations {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://vehicule-service:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ==========================================
    # 3. BACKEND ENTRETIEN (Laravel :8004)
    # ==========================================
    location ^~ /api/gestionnaires {
        proxy_pass http://entretien-app:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ^~ /api/entretiens {
        proxy_pass http://entretien-app:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ^~ /api/declarations {
        proxy_pass http://entretien-app:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ^~ /api/alertes {
        proxy_pass http://entretien-app:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ==========================================
    # 4. BACKEND CARBURANT (FastAPI :8000)
    # ==========================================
    location ^~ /carburants {
        proxy_pass http://carburant-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ^~ /api/carburant {
        proxy_pass http://carburant-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ^~ /api/pleins {
        proxy_pass http://carburant-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ==========================================
    # 5. ROUTAGE REACT (SPA)
    # ==========================================
    location / {
        try_files $uri $uri/ /index.html;
    }
}