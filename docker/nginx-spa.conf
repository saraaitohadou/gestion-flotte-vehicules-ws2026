server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Résolution DNS interne Docker en IPv4 uniquement (évite les erreurs IPv6 Connection refused)
    resolver 127.0.0.11 ipv6=off valid=10s;

    # ==========================================
    # 1. BACKEND CHAUFFEUR (FastAPI :8000)
    # ==========================================
    location = /login {
        set $chauffeur_upstream http://chauffeur-service:8000;
        rewrite ^ /api/auth/login break;
        proxy_pass $chauffeur_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ^~ /api/auth {
        set $chauffeur_upstream http://chauffeur-service:8000;
        proxy_pass $chauffeur_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ^~ /api/chauffeurs {
        set $chauffeur_upstream http://chauffeur-service:8000;
        proxy_pass $chauffeur_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ^~ /espace-chauffeur {
        set $chauffeur_upstream http://chauffeur-service:8000;
        proxy_pass $chauffeur_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ^~ /vehicules-disponibles {
        set $chauffeur_upstream http://chauffeur-service:8000;
        proxy_pass $chauffeur_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ==========================================
    # 2. BACKEND VÉHICULE (PHP :80 - sans préfixe /api)
    # ==========================================
    location ^~ /api/vehicules {
        set $vehicule_upstream http://vehicule-service:80;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $vehicule_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ^~ /api/affectations {
        set $vehicule_upstream http://vehicule-service:80;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $vehicule_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ==========================================
    # 3. BACKEND ENTRETIEN (Laravel :8004)
    # ==========================================
    # Ce fichier est partage par tous les frontends. Le service Vehicule occupe
    # deja /api/vehicules : les proxies lecture du module Entretien utilisent donc
    # un prefixe dedie, réécrit vers les routes Laravel /api/vehicules*.
    location ^~ /api/entretien {
        set $entretien_upstream http://entretien-app:8004;
        rewrite ^/api/entretien/(.*)$ /api/$1 break;
        proxy_pass $entretien_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ^~ /api/gestionnaires {
        set $entretien_upstream http://entretien-app:8004;
        proxy_pass $entretien_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ^~ /api/entretiens {
        set $entretien_upstream http://entretien-app:8004;
        proxy_pass $entretien_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ^~ /api/declarations {
        set $entretien_upstream http://entretien-app:8004;
        proxy_pass $entretien_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # ==========================================
    # 4. BACKEND CARBURANT (FastAPI :8000)
    # ==========================================
    location ^~ /carburants {
        set $carburant_upstream http://carburant-service:8000;
        proxy_pass $carburant_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ^~ /api/carburant {
        set $carburant_upstream http://carburant-service:8000;
        proxy_pass $carburant_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ^~ /api/pleins {
        set $carburant_upstream http://carburant-service:8000;
        proxy_pass $carburant_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ==========================================
    # 5. ROUTAGE REACT (SPA)
    # ==========================================
    location / {
        try_files $uri $uri/ /index.html;
    }
}